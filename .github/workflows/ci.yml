name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Giveaway Worker install
        run: npm ci
        working-directory: workers/giveaway

      - name: Giveaway Worker typecheck
        run: npm run typecheck
        working-directory: workers/giveaway

      - name: Giveaway Worker test
        run: npm test
        working-directory: workers/giveaway

      - name: Pack giveaway tarball
        run: npm run giveaway:pack
